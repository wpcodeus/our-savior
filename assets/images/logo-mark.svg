<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Our Savior Lutheran emblem">
  <circle cx="50" cy="50" r="48" fill="#F9C22E"/>
  <circle cx="50" cy="50" r="42" fill="#2E3192"/>
  <!-- three crosses (Calvary) -->
  <g fill="#F9C22E">
    <!-- center tall cross -->
    <rect x="47.6" y="24" width="4.8" height="50" rx="1"/>
    <rect x="38" y="37" width="24" height="4.8" rx="1"/>
    <!-- left cross -->
    <rect x="31.5" y="40" width="3.8" height="34" rx="1"/>
    <rect x="24" y="49" width="18.8" height="3.8" rx="1"/>
    <!-- right cross -->
    <rect x="64.7" y="40" width="3.8" height="34" rx="1"/>
    <rect x="57.2" y="49" width="18.8" height="3.8" rx="1"/>
  </g>
</svg>
